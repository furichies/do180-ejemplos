apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    tier: frontend
  annotations:
    owner: alumno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
        version: v1
    spec:
      containers:
      - name: web
        image: quay.io/ricardo_instructor_formacion/cooperativa-web:web-1.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_ENV
          value: cap2
