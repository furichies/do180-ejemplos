apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: quay.io/ricardo_instructor_formacion/cooperativa-web:web-1.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_ENV
          value: cap4
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
  labels:
    app: web
spec:
  to:
    kind: Service
    name: web
  port:
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: db
        image: quay.io/ricardo_instructor_formacion/cooperativa-web:web-1.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_ENV
          value: db
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
spec:
  selector:
    app: db
  ports:
  - name: http
    port: 8080
    targetPort: 8080
